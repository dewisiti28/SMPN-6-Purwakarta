<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Fasilitas - SMP Negeri 6 Purwakarta</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="galeri-ekskul.css"> </head>
<body>

    <aside class="sidebar" id="sidebar">
        <div class="brand">
            <div class="logo-icon"><i class="fas fa-graduation-cap"></i></div>
            <div class="brand-text">
                <strong>SMP Negeri 6</strong>
                <small>Purwakarta</small>
            </div>
        </div>
        <nav class="nav-links">
            <a href="index.html" class="nav-item"><i class="fas fa-home"></i> Beranda</a>
            <a href="profil.html" class="nav-item"><i class="fas fa-user"></i> Profil</a>
            <a href="berita.html" class="nav-item"><i class="fas fa-newspaper"></i> Berita</a>
            <a href="galeri.html" class="nav-item active"><i class="fas fa-image"></i> Galeri</a>
            <a href="kontak.html" class="nav-item"><i class="fas fa-phone"></i> Kontak</a>
        </nav>
    </aside>

    <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>

    <main class="main-content">
        <header class="header-section">
            <div class="header-content">
                <a href="galeri.html" class="back-link"><i class="fas fa-arrow-left"></i> Kembali</a>
                <h1>Fasilitas Sekolah</h1>
                <p>Sarana dan prasarana pendukung KBM di SMPN 6 Purwakarta</p>
            </div>
        </header>

        <div class="gallery-container">
            <div class="photo-grid" id="fasilitas-grid">
                <div class="loading-state">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Memuat data fasilitas...</p>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SB_URL = "https://pgsiavnkxrpeyvtmtglp.supabase.co";
        const SB_KEY = "sb_publishable_jjVemBz_ymH0CCbJhvbaKg_R1yFD6ka";
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        async function loadFasilitas() {
            const grid = document.getElementById('fasilitas-grid');
            
            try {
                const { data, error } = await _supabase
                    .from('fasilitas') // MEMANGGIL TABEL FASILITAS
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!data || data.length === 0) {
                    grid.innerHTML = `<p class="empty-msg">Belum ada foto fasilitas.</p>`;
                    return;
                }

                grid.innerHTML = '';

                data.forEach(item => {
                    grid.innerHTML += `
                        <div class="photo-card">
                            <div class="card-image">
                                <img src="${item.url_gambar}" alt="${item.nama_fasilitas}">
                                <span class="category-badge" style="background: #dcfce7; color: #166534;">Fasilitas</span>
                            </div>
                            <div class="photo-info">
                                <h3>${item.nama_fasilitas}</h3>
                                <p>${item.description || 'Sarana prasarana SMP Negeri 6 Purwakarta.'}</p>
                            </div>
                        </div>`;
                });

            } catch (err) {
                console.error(err);
                grid.innerHTML = `<p>Gagal memuat data.</p>`;
            }
        }

        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');
        menuToggle.addEventListener('click', () => {
            sidebar.classList.toggle('active');
        });

        document.addEventListener('DOMContentLoaded', loadFasilitas);
    </script>
</body>
</html>
