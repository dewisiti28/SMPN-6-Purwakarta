<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - SMPN 6 Purwakarta</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <aside class="sidebar">
        <div class="logo-box">
            <div class="logo-circle"><i class="fas fa-user-shield"></i></div>
            <div class="logo-text">
                <h2>Admin SMPN 6</h2>
                <p>Purwakarta</p>
            </div>
        </div>
        <nav class="nav-links">
            <a href="#" class="nav-item active" onclick="switchTab('berita', this)">
                <i class="fas fa-newspaper"></i> Kelola Berita
            </a>
            <a href="#" class="nav-item" onclick="switchTab('fasilitas', this)">
                <i class="fas fa-building"></i> Fasilitas
            </a>
            <a href="#" class="nav-item" onclick="switchTab('ekstrakulikuler', this)">
                <i class="fas fa-running"></i> Ekstrakurikuler
            </a>
            <hr style="border: 0.5px solid rgba(255,255,255,0.1); width: 100%; margin: 10px 0;">
            <a href="index.html" class="nav-item"><i class="fas fa-external-link-alt"></i> Lihat Website</a>
            <a href="#" onclick="logout()" class="nav-item logout"><i class="fas fa-power-off"></i> Keluar</a>
        </nav>
    </aside>

    <main class="admin-main">
        <header class="section-title">
            <h1 id="tabTitle">Kelola Berita</h1>
            <button class="btn-primary" onclick="openAddModal()">
                <i class="fas fa-plus"></i> Tambah Data
            </button>
        </header>

        <div id="adminDataList">
            </div>
    </main>

    <div id="formModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Tambah Data</h2>
                <button onclick="closeModal()" class="close-btn"><i class="fas fa-times"></i></button>
            </div>
            
            <form id="mainForm">
                <input type="hidden" id="f_id">
                <input type="hidden" id="current_img_url">

                <div class="form-group">
                    <label id="labelJudul">Judul / Nama</label>
                    <input type="text" id="f_judul" required>
                </div>

                <div class="form-group" id="groupKategori">
                    <label>Kategori</label>
                    <input type="text" id="f_kategori" placeholder="Contoh: Prestasi / Kegiatan">
                </div>

                <div class="form-group" id="groupRingkasan">
                    <label>Ringkasan Singkat</label>
                    <textarea id="f_ringkasan" rows="2"></textarea>
                </div>

                <div class="form-group">
                    <label id="labelIsi">Isi Lengkap / Keterangan</label>
                    <textarea id="f_isi" rows="5" required></textarea>
                </div>

                <div class="form-group">
                    <label>Foto</label>
                    <div class="upload-box" onclick="document.getElementById('f_file').click()">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <p id="uploadFileName">Klik untuk pilih gambar</p>
                        <input type="file" id="f_file" accept="image/*" style="display:none;">
                    </div>
                    <img id="imgPreview" src="" style="width:100%; margin-top:10px; border-radius:10px; display:none;">
                </div>

                <button type="submit" id="btnSubmit" class="btn-submit">Simpan Data</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="admin.js"></script>
</body>
</html>
