<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - SMP Negeri 6 Purwakarta</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --primary: #1040a3; --bg: #f8fafc; --text: #1e293b; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; display: flex; color: var(--text); }
        
        /* Sidebar */
        .sidebar { width: 260px; background: var(--primary); color: white; height: 100vh; position: fixed; padding: 20px; display: flex; flex-direction: column; box-sizing: border-box; }
        .logo-box { display: flex; align-items: center; gap: 15px; margin-bottom: 40px; }
        .nav-links { display: flex; flex-direction: column; gap: 8px; flex-grow: 1; }
        .nav-item { color: white; text-decoration: none; padding: 12px 15px; border-radius: 10px; display: flex; align-items: center; gap: 10px; transition: 0.3s; cursor: pointer; }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.15); }

        /* Main Content */
        .admin-main { flex-grow: 1; margin-left: 260px; padding: 40px; min-height: 100vh; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        
        /* News Cards */
        .admin-card { background: white; border-radius: 15px; padding: 15px; display: flex; align-items: center; gap: 20px; margin-bottom: 15px; border: 1px solid #e2e8f0; }
        .card-thumb { width: 80px; height: 60px; border-radius: 8px; object-fit: cover; background: #eee; }
        .card-info { flex-grow: 1; }
        .badge { font-size: 11px; padding: 3px 10px; background: #e0f2fe; color: #0369a1; border-radius: 50px; font-weight: 600; }

        /* Buttons */
        .btn-action { border: none; width: 35px; height: 35px; border-radius: 8px; cursor: pointer; }
        .btn-edit { background: #fef3c7; color: #d97706; }
        .btn-del { background: #fee2e2; color: #dc2626; }
        .btn-primary { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 10px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 8px; }

        /* Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-content { background: white; width: 100%; max-width: 500px; padding: 30px; border-radius: 20px; max-height: 90vh; overflow-y: auto; }
        
        /* Form & Upload */
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1.5px solid #e2e8f0; border-radius: 8px; box-sizing: border-box; }
        .upload-area { border: 2px dashed #cbd5e1; padding: 15px; border-radius: 10px; text-align: center; background: #f1f5f9; cursor: pointer; }
        #imgPreview { width: 100%; max-height: 150px; object-fit: cover; border-radius: 8px; display: none; margin-top: 10px; }
        .btn-submit { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; }

        @media (max-width: 768px) { .sidebar { display: none; } .admin-main { margin-left: 0; padding: 20px; } }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo-box">
            <div class="logo-icon"><i class="fas fa-shield-alt"></i></div>
            <div class="logo-text"><h2>Admin Panel</h2><p>SMPN 6 Purwakarta</p></div>
        </div>
        <nav class="nav-links">
            <a href="admin.html" class="nav-item active"><i class="fas fa-newspaper"></i> Kelola Berita</a>
            <a href="berita.html" class="nav-item"><i class="fas fa-globe"></i> Lihat Web</a>
            <div onclick="logout()" class="nav-item" style="margin-top:auto; color:#fca5a5;"><i class="fas fa-power-off"></i> Keluar</div>
        </nav>
    </aside>

    <main class="admin-main">
        <div class="section-header">
            <h1>Kelola Berita</h1>
            <button class="btn-primary" onclick="openAddModal()">
                <i class="fas fa-plus"></i> Tambah Berita
            </button>
        </div>

        <div id="adminNewsList">
            <p style="text-align: center;">Memuat data...</p>
        </div>
    </main>

    <div id="formModal" class="modal-overlay">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h2 id="modalTitle" style="margin:0;">Tambah Berita</h2>
                <button onclick="closeModal()" style="background:none; border:none; font-size:20px; cursor:pointer;"><i class="fas fa-times"></i></button>
            </div>

            <form id="newsForm">
                <input type="hidden" id="f_id">
                <input type="hidden" id="current_img_url">

                <div class="form-group">
                    <label>Judul Berita</label>
                    <input type="text" id="f_judul" required>
                </div>
                <div class="form-group">
                    <label>Kategori</label>
                    <input type="text" id="f_kategori" placeholder="Prestasi / Kegiatan" required>
                </div>
                <div class="form-group">
                    <label>Ringkasan</label>
                    <textarea id="f_ringkasan" rows="2" required></textarea>
                </div>
                <div class="form-group">
                    <label>Isi Lengkap</label>
                    <textarea id="f_isi" rows="4" required></textarea>
                </div>
                <div class="form-group">
                    <label>Foto Berita</label>
                    <div class="upload-area" onclick="document.getElementById('f_file').click()">
                        <i class="fas fa-image" style="font-size: 24px; color: #64748b;"></i>
                        <p id="uploadText" style="margin:5px 0 0 0; font-size:12px;">Klik untuk upload PNG/JPG</p>
                        <input type="file" id="f_file" accept="image/*" style="display:none;">
                        <img id="imgPreview" src="">
                    </div>
                </div>
                <button type="submit" id="btnSubmit" class="btn-submit">Simpan Berita</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="admin.js"></script>

    <script>
        console.log("HTML terload dengan sukses");
        if (typeof openAddModal !== 'function') {
            console.error("PERINGATAN: Fungsi openAddModal tidak ditemukan! Cek file admin.js Anda.");
        }
    </script>
</body>
</html>
